apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: playit-agent
spec:
  endpointSelector:
    matchLabels:
      app: playit-agent
  egress:
    # Allow DNS
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Allow outbound tunnel connection to playit.gg cloud
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "0"
              protocol: UDP
              endPort: 65535
            - port: "443"
              protocol: TCP
    # Allow all egress to the same namespace to reach minecraft-be service/pods
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: minecraft-be
    # Allow access to minecraft-be server for forwarding
    - toServices:
        - k8sService:
            serviceName: minecraft-be
            namespace: minecraft-be
      toPorts:
        - ports:
            - port: "19132"
              protocol: UDP

    # Allow forwarding to Minecraft server via Service
    - toEndpoints:
        - matchLabels:
            app: minecraft-be
      toPorts:
        - ports:
            - port: "19132"
              protocol: UDP
