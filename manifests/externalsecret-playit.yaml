apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: playit-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: playit-secret
  data:
    - secretKey: secret-key
      remoteRef:
        key: minecraft-be/playit-secret-key
