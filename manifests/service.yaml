apiVersion: v1
kind: Service
metadata:
  name: minecraft-be
  labels:
    app: minecraft-be
  annotations:
    # Assign a fixed LAN IP via Cilium LB IPAM. Adjust to a free IP in your pool.
    io.cilium/lb-ipam-ips: 192.168.1.105
spec:
  type: LoadBalancer
  selector:
    app: minecraft-be
  ports:
    - name: mc-udp
      port: 19132
      targetPort: mc-udp
      protocol: UDP
    - name: mc-udp-v6
      port: 19133
      targetPort: mc-udp-v6
      protocol: UDP
